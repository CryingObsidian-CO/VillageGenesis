name: Reopen Issue
run-name: \#${{ github.event.issue.number }} ${{ github.event.issue.title }}

on:
  issues:
    types: [ reopened ]

jobs:
  issue-reopened:
    runs-on: ubuntu-latest
    steps:
      - name: Create reopen comment
        uses: actions-cool/issues-helper@v3
        with:
          actions: 'create-comment'
          token: ${{ secrets.BOT }}
          body: |
            🔄 这个Issue已经被重新打开！
            
            感谢您的反馈，我们将重新评估这个问题。请提供任何可能有助于解决问题的新信息或上下文。

      - name: Remove processing labels
        uses: actions-cool/issues-helper@v3
        with:
          actions: 'remove-labels'
          token: ${{ secrets.BOT }}
          labels: '👌 完成 | Resolved,❌ 拒绝 | Rejected,❌ 重复 | Duplicate,❌ 第三方 | Third Party,❌ 无计划 | Won''t Fix,❌ 已过时 | Obsolete'
      
      - name: Add pending label
        uses: actions-cool/issues-helper@v3
        with:
          actions: 'add-labels'
          token: ${{ secrets.BOT }}
          labels: '⭕ 等待处理 | Pending'
